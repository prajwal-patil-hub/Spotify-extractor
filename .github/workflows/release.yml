name: Release builds

# docs/13 §1-2: tag v* → build matrix → artifacts. Store uploads and code
# signing hook in here once signing secrets exist in the GitHub environment
# (never in the repo — docs/06).
on:
  push:
    tags: ['v*']

jobs:
  web:
    name: Web (PWA bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release
        working-directory: apps/bridgetune_app
      - uses: actions/upload-artifact@v4
        with:
          name: bridgetune-web-${{ github.ref_name }}
          path: apps/bridgetune_app/build/web

  android:
    name: Android (unsigned APK)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
        working-directory: apps/bridgetune_app
      - uses: actions/upload-artifact@v4
        with:
          name: bridgetune-android-${{ github.ref_name }}
          path: apps/bridgetune_app/build/app/outputs/flutter-apk/app-release.apk

  linux:
    name: Linux (bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: GTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release
        working-directory: apps/bridgetune_app
      - uses: actions/upload-artifact@v4
        with:
          name: bridgetune-linux-${{ github.ref_name }}
          path: apps/bridgetune_app/build/linux/x64/release/bundle
