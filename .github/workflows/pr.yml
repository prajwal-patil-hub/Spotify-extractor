name: PR checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format · Analyze · Boundaries · Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Resolve dependencies
        run: dart pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Static analysis (infos are fatal)
        run: dart analyze --fatal-infos

      - name: Architecture boundary lint
        run: dart run repo_tools:check_boundaries

      - name: Tests — every package with a test suite
        run: |
          set -e
          for pkg in packages/* tools/*; do
            if [ -d "$pkg/test" ]; then
              echo "── dart test in $pkg"
              (cd "$pkg" && dart test)
            fi
          done

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
