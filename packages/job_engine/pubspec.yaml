name: job_engine
description: >-
  The durable background job engine (docs/08): DB-checkpointed transfer
  queue with resume, retry policy driven by the typed error hierarchy,
  pause/cancel, dedup-on-resume idempotence, and the verification pass.
  Pure Dart; storage is a port implemented by data_local.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  core_domain: ^0.1.0
  meta: ^1.16.0
  provider_api: ^0.1.0

dev_dependencies:
  lints: ^6.0.0
  matching_engine: ^0.1.0
  test: ^1.26.0
  testing_toolkit: ^0.1.0
